name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Test, typecheck and build the UI (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/check.ps1
      - name: Test, typecheck and build the UI (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Test, typecheck and build the UI (macOS / Linux)
        if: runner.os != 'Windows'
        run: bun run check
      - name: Browser smoke check (Linux)
        if: runner.os == 'Linux'
        run: |
          bunx playwright install --with-deps chromium
          bun run scripts/browser-check.ts
