name: Bug report
description: Report a reproducible problem. Remove private task data and credentials.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction steps using fictional tasks.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Environment
      placeholder: OS, Bun version, browser version, source revision
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, task notes, usernames, home paths and workspace details.
